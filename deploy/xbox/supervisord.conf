[unix_http_server]
file=%(ENV_HOME)s/ollamaforvlas/run/supervisor.sock
chmod=0600

[supervisord]
logfile=%(ENV_HOME)s/ollamaforvlas/logs/supervisor.log
logfile_maxbytes=1MB
logfile_backups=2
pidfile=%(ENV_HOME)s/ollamaforvlas/run/supervisord.pid
childlogdir=%(ENV_HOME)s/ollamaforvlas/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_HOME)s/ollamaforvlas/run/supervisor.sock

[program:firebird]
command=%(ENV_HOME)s/ollamaforvlas/current/.venv/bin/python -m vla_platform.cli serve --port 8096
directory=%(ENV_HOME)s/ollamaforvlas/current
environment=PATH="%(ENV_HOME)s/.local/bin:/usr/local/bin:/usr/bin:/bin",FIREBIRD_DATA_DIR="%(ENV_HOME)s/ollamaforvlas/data",FIREBIRD_WEB_DIR="%(ENV_HOME)s/ollamaforvlas/current/apps/web/out",PYTHONUNBUFFERED="1"
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/ollamaforvlas/logs/firebird.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2

[program:firebird-public]
command=%(ENV_HOME)s/ollamaforvlas/current/.venv/bin/python %(ENV_HOME)s/ollamaforvlas/public_gateway.py
directory=%(ENV_HOME)s/ollamaforvlas
environment=FIREBIRD_PUBLIC_CONFIG="%(ENV_HOME)s/ollamaforvlas/private/public-gateway.json",PYTHONUNBUFFERED="1"
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/ollamaforvlas/logs/firebird-public.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
