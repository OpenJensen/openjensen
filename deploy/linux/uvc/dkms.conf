PACKAGE_NAME="openjensen-uvc"
PACKAGE_VERSION="1.0"
AUTOINSTALL="yes"
NO_WEAK_MODULES="yes"
PRE_BUILD="build_driver.py ${kernelver} --prepare uvc"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/uvc modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/uvc clean"
BUILT_MODULE_NAME[0]="uvcvideo"
BUILT_MODULE_LOCATION[0]="uvc"
DEST_MODULE_LOCATION[0]="/updates/dkms"
