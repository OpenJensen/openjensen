[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
license = {text = "Apache-2.0"}
name = "jensen-quant"
version = "0.1.0"
description = "Architecture-independent packed weight quantization and portable PyTorch inference"
requires-python = ">=3.11,<3.13"
dependencies = ["torch>=2.2,<3", "safetensors>=0.6.2,<1", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "ruff==0.13.2"]

[project.scripts]
jensen-quant = "jensen_quant.cli:main"
# Compatibility command for alpha installations.
firebird-quant = "jensen_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["native_act: opt-in complete pinned ACT CPU runtime proof"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
