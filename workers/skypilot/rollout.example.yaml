name: isaac-vla
execution: parallel
primary_tasks: [isaac]
termination_delay: 30s
---
name: isaac
workdir: ../isaac_sim
file_mounts:
  ~/sim-control: ./remote
num_nodes: 1
resources:
  infra: gcp/us-central1
  instance_type: g2-standard-16
  accelerators: L4:1
  use_spot: false
  disk_size: 200
  disk_tier: medium
  image_id: projects/sky-dev-465/global/images/skypilot-gcp-gpu-ubuntu-260603
envs:
  ACCEPT_EULA: null
  SIM_IMAGE: us-east4-docker.pkg.dev/CHANGE_ME_PROJECT_ID/simulation/isaac-worker@sha256:CHANGE_ME_IMAGE_DIGEST
  SIM_MANIFEST: scenes/so101-pickup/rollout.local.yaml
  SIM_RESULTS_URI: gs://CHANGE_ME_PROJECT_ID-sim-results/rollouts
  SIM_SETUP_TIMEOUT: '2400'
  SIM_SETUP_KILL_GRACE: '60'
  SIM_JOB_TIMEOUT: '3600'
  POLICY_DISCOVERY_TIMEOUT: '900'
setup: |
  set -euo pipefail
  timeout --signal=TERM --kill-after="$SIM_SETUP_KILL_GRACE" "$SIM_SETUP_TIMEOUT" bash ~/sim-control/setup.sh
run: |
  set -euo pipefail
  python3 ~/sim-control/rollout_runner.py
---
name: vla
workdir: ../isaac_sim
file_mounts:
  ~/sim-control: ./remote
  ~/vla-checkpoint: /CHANGE_ME_LOCAL_CHECKPOINT_DIRECTORY
num_nodes: 1
resources:
  infra: gcp/us-central1
  instance_type: a3-highgpu-1g
  accelerators: H100:1
  use_spot: true
  disk_size: 200
  disk_tier: medium
envs:
  MODEL_ID: CHANGE_ME_IMMUTABLE_MODEL_ID
  POLICY_STATE_DIM: '6'
  POLICY_ACTION_STEPS: '1'
  POLICY_CAMERA_KEY: observation.images.front
  POLICY_SETUP_TIMEOUT: '2400'
  POLICY_JOB_TIMEOUT: '4500'
setup: |
  set -euo pipefail
  timeout --signal=TERM --kill-after=60 "$POLICY_SETUP_TIMEOUT" bash ~/sim-control/policy_setup.sh
run: |
  set -euo pipefail
  exec timeout --signal=TERM --kill-after=60 "$POLICY_JOB_TIMEOUT" \
    ~/vla-env/bin/python -m sim_worker.rollout.server \
    --host 0.0.0.0 --port 8080 --backend lerobot --device cuda \
    --checkpoint ~/vla-checkpoint --model-id "$MODEL_ID" \
    --state-dim "$POLICY_STATE_DIM" --action-steps "$POLICY_ACTION_STEPS" \
    --camera-key "$POLICY_CAMERA_KEY"
