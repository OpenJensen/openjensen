name: isaac-act-motion
execution: parallel
primary_tasks:
- isaac
termination_delay: 30s
---
name: isaac
workdir: ../isaac_sim
file_mounts:
  ~/sim-control: ./remote
num_nodes: 1
resources:
  infra: gcp/us-central1/us-central1-c
  accelerators: L4:1
  use_spot: false
  disk_size: 200
  disk_tier: medium
  image_id: projects/sky-dev-465/global/images/skypilot-gcp-gpu-ubuntu-260603
  ordered:
  - instance_type: g2-standard-32
  - instance_type: g2-standard-12
envs:
  ACCEPT_EULA: null
  SIM_IMAGE: us-east4-docker.pkg.dev/project-5693e83a-db3a-43e1-98c/simulation/isaac-worker@sha256:3c3203e337e45f45ab9537b29927e50b750944f981cc069275842233ad069f82
  SIM_MANIFEST: scenes/so101-pickup/rollout.experimental.yaml
  SIM_RESULTS_URI: gs://project-5693e83a-db3a-43e1-98c-sim-results/act-motion-tests
  SIM_SETUP_TIMEOUT: '2400'
  SIM_SETUP_KILL_GRACE: '60'
  SIM_JOB_TIMEOUT: '1800'
  POLICY_DISCOVERY_TIMEOUT: '900'
setup: |
  set -euo pipefail
  timeout --signal=TERM --kill-after="$SIM_SETUP_KILL_GRACE" "$SIM_SETUP_TIMEOUT" bash ~/sim-control/setup.sh
run: |
  set -euo pipefail
  python3 ~/sim-control/rollout_runner.py
---
name: vla
workdir: ../isaac_sim
file_mounts:
  ~/sim-control: ./remote
  ~/vla-checkpoint: ~/models/act_step29000
num_nodes: 1
resources:
  infra: gcp/us-central1
  instance_type: a3-highgpu-1g
  accelerators: H100:1
  use_spot: true
  disk_size: 200
  disk_tier: medium
envs:
  MODEL_ID: sha256:6312d47c28ffac8c2412deeb2d5327e15fb639b25e91f7e17329fc31f4a0ba50
  POLICY_STATE_DIM: '6'
  POLICY_ACTION_STEPS: '100'
  POLICY_CAMERA_KEY: observation.images.front
  POLICY_SETUP_TIMEOUT: '2400'
  POLICY_JOB_TIMEOUT: '4500'
setup: |
  set -euo pipefail
  timeout --signal=TERM --kill-after=60 "$POLICY_SETUP_TIMEOUT" bash ~/sim-control/policy_setup.sh
run: |
  set -euo pipefail
  exec timeout --signal=TERM --kill-after=60 "$POLICY_JOB_TIMEOUT" \
    ~/vla-env/bin/python -m sim_worker.rollout.server \
    --host 0.0.0.0 --port 8080 --backend lerobot --device cuda \
    --checkpoint ~/vla-checkpoint --model-id "$MODEL_ID" \
    --state-dim "$POLICY_STATE_DIM" --action-steps "$POLICY_ACTION_STEPS" \
    --camera-key "$POLICY_CAMERA_KEY"
