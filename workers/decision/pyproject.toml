[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "firebird-decision-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.11.0", "safetensors==0.8.0", "tokenizers==0.23.2"]

[project.scripts]
firebird-decision = "firebird_decision.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/firebird_decision"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
