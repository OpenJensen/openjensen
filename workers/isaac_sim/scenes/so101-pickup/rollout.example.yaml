api_version: simulation.rollout/v1alpha1
scene:
  uri: scene.usda
  camera: /World/Cameras/Front
  articulation: /World/Robot/joints/root_joint
  joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]
capture:
  width: 1920
  height: 1080
control:
  fps: 30
  physics_hz: 120
  steps: 150
  execute_steps: 1
policy:
  endpoint: http://127.0.0.1:8080
  model_id: REPLACE_WITH_EXPORTED_CHECKPOINT_ID
  task: Pick up the cube and place it in the box
  timeout_seconds: 120
calibration: calibration.example.yaml
