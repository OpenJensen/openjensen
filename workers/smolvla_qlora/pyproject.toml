[build-system]
requires = ["setuptools>=71,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "firebird-vla"
version = "0.1.0"
description = "Isolated SmolVLA quantized fine-tuning worker"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
smolvla = [
  "lerobot[smolvla,peft]==0.4.4",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "torchcodec==0.5.0; sys_platform == 'linux'",
  "transformers==4.57.1",
  "peft==0.18.0",
  "bitsandbytes==0.48.2",
  "accelerate==1.10.1",
  "huggingface-hub==0.35.3",
  "safetensors==0.6.2",
]
dev = ["pytest==8.4.2", "ruff==0.13.2"]

[project.scripts]
firebird-finetune = "firebird_vla.train:main"
firebird-verify = "firebird_vla.verify:main"
firebird-check-qlora = "firebird_vla.checks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["cuda: requires the training extra and a BF16 CUDA GPU"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
