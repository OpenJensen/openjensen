[build-system]
requires = ["setuptools>=71,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "firebird-act-optimizer"
version = "0.1.0"
description = "Isolated, inference-only ACT export with fresh CPU parity verification"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
cpu = ["lerobot==0.6.1", "torch==2.11.0", "torchvision==0.26.0", "safetensors==0.8.0"]
dev = ["pytest==9.1.1", "ruff==0.16.9", "mypy==1.19.1", "pytest-cov==7.0.0"]

[project.scripts]
firebird-act-export = "firebird_act.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["runtime: needs the pinned CPU LeRobot runtime"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["firebird_act"]
patch = ["subprocess"]
parallel = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
