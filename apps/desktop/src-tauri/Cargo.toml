[package]
name = "firebird-desktop"
version = "0.1.0"
description = "Firebird local desktop workbench"
authors = ["Firebird contributors"]
edition = "2024"
rust-version = "1.98.1"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[features]
custom-protocol = ["tauri/custom-protocol"]
