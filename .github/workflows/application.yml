name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      windows_browser:
        description: Also run Windows core, terminal, and complete browser/build checks
        type: boolean
        default: false
# Supersede obsolete PR revisions, but retain every main/manual verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    runs-on: ${{ fromJSON((vars.CI_RUNNER == 'gcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","firebird-gcp"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 3
    outputs:
      application: ${{ steps.changes.outputs.application }}
      unified_quantization: ${{ steps.changes.outputs.unified_quantization }}
      quantization: ${{ steps.changes.outputs.quantization }}
      training: ${{ steps.changes.outputs.training }}
      benchmark: ${{ steps.changes.outputs.benchmark }}
      act: ${{ steps.changes.outputs.act }}
      teaching: ${{ steps.changes.outputs.teaching }}
      decision: ${{ steps.changes.outputs.decision }}
      desktop_lane: ${{ steps.changes.outputs.desktop_lane }}
      mobile_lane: ${{ steps.changes.outputs.mobile_lane }}
      web_lane: ${{ steps.changes.outputs.web_lane }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
      full: ${{ steps.changes.outputs.full }}
      py_shards: ${{ steps.changes.outputs.py_shards }}
      web_matrix: ${{ steps.changes.outputs.web_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect disposable runner during package maintenance
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo bash .github/scripts/prepare_runner.sh
      - id: changes
        run: python3 .github/scripts/ci_scope.py
        env:
          # Optional repository variables; blank = built-in defaults (2 / 4 / 6).
          CI_PY_SHARDS: ${{ vars.CI_PY_SHARDS }}
          CI_DESKTOP_SHARDS: ${{ vars.CI_DESKTOP_SHARDS }}
          CI_MOBILE_SHARDS: ${{ vars.CI_MOBILE_SHARDS }}
  application:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.application != 'false') }}
    name: application (${{ matrix.os }}, ${{ matrix.shard }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Test files are packed into balanced shards by ci_pyshard.py; xdist fans out inside each.
        shard: ${{ fromJSON(needs.scope.outputs.py_shards || '["1/1"]') }}
        # Hackathon default is Linux. Windows is an explicit manual opt-in.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.windows_browser && '["ubuntu-24.04","windows-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ fromJSON(matrix.os == 'ubuntu-24.04' && (vars.CI_RUNNER == 'gcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","firebird-gcp"]' || format('["{0}"]', matrix.os)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Protect disposable runner during package maintenance
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo bash .github/scripts/prepare_runner.sh
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.14.7'
          enable-cache: true
          cache-suffix: application
          # Real dependency inputs only: editing this workflow must not evict the cache.
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            packages/core/pyproject.toml
      - run: uv sync --frozen --all-packages --extra tui
      - name: Prepare hosted package mirrors
        if: runner.environment != 'self-hosted' && runner.os == 'Linux'
        run: sudo bash .github/scripts/prepare_hosted_runner.sh
      - name: Install video validation tools (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Install isolated CPU preview reader (POSIX)
        if: runner.os != 'Windows'
        run: |
          uv venv --python 3.14.7 workers/_cpu_readers/.venv
          uv pip install --python workers/_cpu_readers/.venv/bin/python -r workers/_cpu_readers/requirements.txt
      - name: Install isolated CPU preview reader (Windows)
        if: runner.os == 'Windows'
        run: |
          uv venv --python 3.14.7 workers/_cpu_readers/.venv
          uv pip install --python workers/_cpu_readers/.venv/Scripts/python.exe -r workers/_cpu_readers/requirements.txt
      - run: uv run --no-sync ruff check packages/core scripts tests .github/scripts
        if: runner.os == 'Linux' && startsWith(matrix.shard, '1/')
      - run: uv run --no-sync ruff format --check packages/core scripts tests .github/scripts
        if: runner.os == 'Linux' && startsWith(matrix.shard, '1/')
      - name: pytest (this shard, parallel with xdist)
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t files < <(uv run --no-sync python .github/scripts/ci_pyshard.py --shard "$SHARD")
          test "${#files[@]}" -gt 0
          uv run --frozen pytest -q -n auto --dist loadfile "${files[@]}"
  web:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.web_lane != 'false') }}
    name: web (${{ matrix.os }}, ${{ matrix.leg.name }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # core = OpenAPI/type/build checks + pure/openapi/workflow + diagnostics.
        # desktop/mobile legs are Playwright --shard slices; mobile legs exist only when
        # scope selected mobile_lane. The list comes from ci_scope.py (web_matrix).
        leg: ${{ fromJSON(needs.scope.outputs.web_matrix || '[{"name":"core","kind":"core","project":"","shard":""},{"name":"desktop 1/1","kind":"shard","project":"desktop","shard":"1/1"}]') }}
        # Hackathon default is Linux. Windows is an explicit manual opt-in.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.windows_browser && '["ubuntu-24.04","windows-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ fromJSON(matrix.os == 'ubuntu-24.04' && (vars.CI_RUNNER == 'gcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","firebird-gcp"]' || format('["{0}"]', matrix.os)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Protect disposable runner during package maintenance
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo bash .github/scripts/prepare_runner.sh
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux' || inputs.windows_browser
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.14.7'
          enable-cache: true
          cache-suffix: application
          # Real dependency inputs only: editing this workflow must not evict the cache.
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            packages/core/pyproject.toml
      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux' || inputs.windows_browser
        with:
          version: '12.6.0'
          cache: false
      # pnpm store cache (the only package-manager cache; setup-node cache would duplicate it).
      - id: pnpm-store
        if: runner.os == 'Linux' && runner.environment != 'self-hosted'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: runner.os == 'Linux' && runner.environment != 'self-hosted'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - run: uv sync --frozen --all-packages --extra tui
      - name: Prepare hosted package mirrors
        if: runner.environment != 'self-hosted' && runner.os == 'Linux'
        run: sudo bash .github/scripts/prepare_hosted_runner.sh
      - name: Install video validation tools (Linux)
        if: runner.os == 'Linux' && runner.environment != 'self-hosted'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Install isolated CPU preview reader (POSIX)
        if: runner.os != 'Windows'
        run: |
          uv venv --python 3.14.7 workers/_cpu_readers/.venv
          uv pip install --python workers/_cpu_readers/.venv/bin/python -r workers/_cpu_readers/requirements.txt
      - name: Install isolated CPU preview reader (Windows)
        if: runner.os == 'Windows'
        run: |
          uv venv --python 3.14.7 workers/_cpu_readers/.venv
          uv pip install --python workers/_cpu_readers/.venv/Scripts/python.exe -r workers/_cpu_readers/requirements.txt
      - run: pnpm install --frozen-lockfile --prefer-offline
        if: runner.os == 'Linux' || inputs.windows_browser
      # OpenAPI contract, generated client and type checks are identical on every leg:
      # run them once, on the core leg.
      - run: uv run --no-sync python scripts/export_openapi.py
        if: matrix.leg.kind == 'core' && (runner.os == 'Linux' || inputs.windows_browser)
      - run: pnpm generate:client
        if: matrix.leg.kind == 'core' && (runner.os == 'Linux' || inputs.windows_browser)
      - run: git diff --exit-code -- packages/core/openapi.json apps/web/src/lib/api.generated.ts
        if: matrix.leg.kind == 'core' && (runner.os == 'Linux' || inputs.windows_browser)
      - run: pnpm check:web
        if: matrix.leg.kind == 'core' && (runner.os == 'Linux' || inputs.windows_browser)
      # Every leg serves the static export (tests/web/serve.py), so every leg builds it.
      - run: pnpm build:web
        if: runner.os == 'Linux' || inputs.windows_browser
      # All current projects use Chromium headless shell, without a channel.
      - name: Use preinstalled GCP browser dependencies
        run: pnpm exec playwright install --only-shell chromium
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
      - id: playwright-version
        if: runner.os == 'Linux' && runner.environment != 'self-hosted'
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v4
        if: runner.os == 'Linux' && runner.environment != 'self-hosted'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install hosted browser and OS dependencies (cold cache)
        run: pnpm exec playwright install --with-deps --only-shell chromium
        if: runner.os != 'Linux' && runner.environment != 'self-hosted' || runner.os == 'Linux' && runner.environment != 'self-hosted' && steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install hosted OS dependencies only (browser restored from cache)
        run: pnpm exec playwright install-deps chromium
        if: runner.os == 'Linux' && runner.environment != 'self-hosted' && steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Browser tests (core leg - pure, openapi, workflow)
        run: pnpm test:web --project=pure --project=openapi --project=workflow
        if: matrix.leg.kind == 'core' && (runner.os == 'Linux' || inputs.windows_browser)
        env:
          # GCP image = 2 vCPU: keep 2 workers. Hosted = 4 vCPU: 4 workers.
          PW_WORKERS: ${{ runner.environment == 'self-hosted' && '2' || '4' }}
      - run: pnpm test:diagnostics
        if: matrix.leg.kind == 'core'
      - name: Browser tests (${{ matrix.leg.project }} ${{ matrix.leg.shard }})
        run: pnpm test:web --project=${{ matrix.leg.project }} --shard=${{ matrix.leg.shard }}
        if: matrix.leg.kind == 'shard' && (runner.os == 'Linux' || inputs.windows_browser)
        env:
          PW_WORKERS: ${{ runner.environment == 'self-hosted' && '2' || '4' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  application-verification:
    needs: [scope, application, web]
    if: ${{ always() }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER == 'gcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","firebird-gcp"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 2
    steps:
      - name: Verify every selected check completed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_GATE'
          import json, os
          results = json.loads(os.environ['CHECK_RESULTS'])
          scope = results['scope']
          # web covers every browser lane: core, desktop and (when selected) mobile legs.
          required = {'application': 'application', 'web': 'web_lane'}
          failures = []
          for job, output in required.items():
              result = results[job]['result']
              legitimate_skip = (scope['result'] == 'success'
                                 and scope['outputs'].get(output) == 'false'
                                 and result == 'skipped')
              if result != 'success' and not legitimate_skip:
                  failures.append(job + ': ' + result)
          if scope['result'] != 'success':
              failures.append('scope: ' + scope['result'])
          if failures:
              raise SystemExit('; '.join(failures))
          if scope['outputs'].get('docs_only') == 'true':
              print('Documentation-only change: no code checks were required.')
          print('All selected checks passed; unrelated scopes were explicitly skipped.')
          PY_GATE
  quantization:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.quantization != 'false') }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER == 'gcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","firebird-gcp"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/vla_cpp
    steps:
      - uses: actions/checkout@v4
      - name: Protect disposable runner during package maintenance
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo bash .github/scripts/prepare_runner.sh
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.11'
          enable-cache: true
          cache-suffix: quantization
          cache-dependency-glob: workers/vla_cpp/uv.lock
      - run: uv sync --locked --extra quantize --extra test
      - run: uv run --no-sync python -m pytest -q -rs
  unified-quantization:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.unified_quantization != 'false') }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER == 'gcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","firebird-gcp"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch: '2.2.2'
            numpy: '1.26.4'
          - torch: '2.11.0'
            numpy: '2.2.6'
    defaults:
      run:
        working-directory: workers/firebird_quant
    steps:
      - uses: actions/checkout@v4
      - name: Protect disposable runner during package maintenance
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo bash .github/scripts/prepare_runner.sh
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.11'
          enable-cache: true
          cache-suffix: firebird-quant-${{ matrix.torch }}
          cache-dependency-glob: workers/firebird_quant/pyproject.toml
      - run: uv venv --python 3.11
      - run: uv pip install --python .venv/bin/python --index-url https://download.pytorch.org/whl/cpu 'torch==${{ matrix.torch }}'
      - run: uv pip install --python .venv/bin/python -e '.[test]' 'numpy==${{ matrix.numpy }}'
      - run: uv pip check --python .venv/bin/python
      - run: .venv/bin/python -m pytest -q -rs
        env:
          HF_HUB_OFFLINE: '1'
          CUDA_VISIBLE_DEVICES: ''
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/ruff format --check src tests
  training:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.training != 'false') }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER == 'gcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","firebird-gcp"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/smolvla_qlora
    steps:
      - uses: actions/checkout@v4
      - name: Protect disposable runner during package maintenance
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo bash .github/scripts/prepare_runner.sh
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.11'
          enable-cache: true
          cache-suffix: training
          cache-dependency-glob: workers/smolvla_qlora/pyproject.toml
      - run: uv venv --python 3.11
      - run: uv pip install --python .venv/bin/python -e '.[dev]'
      - run: .venv/bin/python -m pytest -q -rs
      - run: .venv/bin/ruff check src tests
  benchmark:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.benchmark != 'false') }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER == 'gcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","firebird-gcp"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/benchmark_gpu
    steps:
      - uses: actions/checkout@v4
      - name: Protect disposable runner during package maintenance
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo bash .github/scripts/prepare_runner.sh
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.11'
          enable-cache: true
          cache-suffix: benchmark
          cache-dependency-glob: workers/benchmark_gpu/pyproject.toml
      - run: uv venv --python 3.11
      - run: uv pip install --python .venv/bin/python pytest==8.4.2 ruff==0.13.2
      - run: .venv/bin/python -m pytest -q -rs
      - run: .venv/bin/ruff check scripts tests
      - name: Verify preserved evidence
        working-directory: workers/benchmark_gpu/evidence/2026-09-26
        run: sha256sum -c SHA256SUMS
  act-inference-export:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.act != 'false') }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER == 'gcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","firebird-gcp"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/act_optimizer
    steps:
      - uses: actions/checkout@v4
      - name: Protect disposable runner during package maintenance
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo bash .github/scripts/prepare_runner.sh
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: act-inference-export
          cache-dependency-glob: workers/act_optimizer/uv.lock
      - run: uv sync --locked --extra cpu --extra dev
      - run: uv run --no-sync python -m pytest -q -rs
        env:
          HF_HUB_OFFLINE: '1'
          CUDA_VISIBLE_DEVICES: ''
      - run: uv run --no-sync ruff check --target-version py312 src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync mypy --config-file pyproject.toml src --follow-imports=silent
  teaching:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.teaching != 'false') }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER == 'gcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","firebird-gcp"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Protect disposable runner during package maintenance
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo bash .github/scripts/prepare_runner.sh
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.12.14'
          enable-cache: true
          cache-suffix: teaching
          cache-dependency-glob: workers/teaching/requirements-*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install isolated CPU dataset writer
        run: |
          uv venv --python 3.12.14 workers/teaching/.venv-dataset
          uv pip install --python workers/teaching/.venv-dataset/bin/python --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0+cpu' 'torchvision==0.26.0+cpu'
          uv pip install --python workers/teaching/.venv-dataset/bin/python -r workers/teaching/requirements-dataset.txt -r workers/teaching/requirements-providers.txt pytest==8.4.2
          uv pip check --python workers/teaching/.venv-dataset/bin/python
      - name: Recorder and real LeRobot data boundaries
        run: workers/teaching/.venv-dataset/bin/python -m pytest -q -rs workers/teaching/tests/test_teaching.py workers/teaching/tests/test_multicapture.py workers/teaching/tests/test_providers.py workers/smolvla_qlora/tests/test_local_dataset.py
        env:
          HF_HUB_OFFLINE: '1'
          CUDA_VISIBLE_DEVICES: ''
          PYTHONPATH: workers/smolvla_qlora/src
      - name: Install separate voice SDK environment
        run: |
          uv venv --python 3.12.14 workers/teaching/.venv-voice
          uv pip install --python workers/teaching/.venv-voice/bin/python -r workers/teaching/requirements-voice.txt pytest==8.4.2
          uv pip check --python workers/teaching/.venv-voice/bin/python
      - name: Voice contract and failure handling (no provider call)
        run: workers/teaching/.venv-voice/bin/python -m pytest -q -rs workers/teaching/tests/test_voice.py
  decision:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.decision != 'false') }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER == 'gcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","firebird-gcp"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Protect disposable runner during package maintenance
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo bash .github/scripts/prepare_runner.sh
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.12.14'
          enable-cache: true
          cache-suffix: decision-contracts
          cache-dependency-glob: workers/decision/requirements*.txt
      - run: uv venv --python 3.12.14 workers/decision/.venv-ci
      - run: uv pip install --python workers/decision/.venv-ci/bin/python pytest==8.4.2
      - name: Advisory worker contracts without model downloads
        run: workers/decision/.venv-ci/bin/python -m pytest -q -rs workers/decision/tests
        env:
          PYTHONPATH: workers/decision/src
          HF_HUB_OFFLINE: '1'
          CUDA_VISIBLE_DEVICES: ''
  native-worker-verification:
    needs: [scope, quantization, unified-quantization, training, benchmark, act-inference-export, teaching, decision]
    if: ${{ always() }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER == 'gcp' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","firebird-gcp"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 2
    steps:
      - name: Verify every selected check completed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_GATE'
          import json, os
          results = json.loads(os.environ['CHECK_RESULTS'])
          scope = results['scope']
          required = {'quantization': 'quantization', 'unified-quantization': 'unified_quantization', 'training': 'training', 'benchmark': 'benchmark', 'act-inference-export': 'act', 'teaching': 'teaching', 'decision': 'decision'}
          failures = []
          for job, output in required.items():
              result = results[job]['result']
              legitimate_skip = (scope['result'] == 'success'
                                 and scope['outputs'].get(output) == 'false'
                                 and result == 'skipped')
              if result != 'success' and not legitimate_skip:
                  failures.append(job + ': ' + result)
          if scope['result'] != 'success':
              failures.append('scope: ' + scope['result'])
          if failures:
              raise SystemExit('; '.join(failures))
          print('All selected checks passed; unrelated scopes were explicitly skipped.')
          PY_GATE
