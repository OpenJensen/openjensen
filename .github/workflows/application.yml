name: Application checks
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      windows_browser:
        description: Also run the complete browser/build suite on Windows
        type: boolean
        default: false
# Supersede obsolete PR revisions, but retain every main/manual verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      application: ${{ steps.changes.outputs.application }}
      quantization: ${{ steps.changes.outputs.quantization }}
      training: ${{ steps.changes.outputs.training }}
      benchmark: ${{ steps.changes.outputs.benchmark }}
      act: ${{ steps.changes.outputs.act }}
      teaching: ${{ steps.changes.outputs.teaching }}
      decision: ${{ steps.changes.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: python3 .github/scripts/ci_scope.py
  application:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.application != 'false') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux' || inputs.windows_browser
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.14.7'
          enable-cache: true
          cache-suffix: application
          cache-dependency-glob: |
            uv.lock
            .github/workflows/application.yml
      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux' || inputs.windows_browser
        with:
          version: '12.6.0'
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: uv sync --frozen --all-packages --extra tui
      - name: Install video validation tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install isolated CPU preview reader (POSIX)
        if: runner.os != 'Windows'
        run: |
          uv venv --python 3.14.7 workers/_cpu_readers/.venv
          uv pip install --python workers/_cpu_readers/.venv/bin/python --no-deps pyarrow==25.0.1
      - name: Install isolated CPU preview reader (Windows)
        if: runner.os == 'Windows'
        run: |
          uv venv --python 3.14.7 workers/_cpu_readers/.venv
          uv pip install --python workers/_cpu_readers/.venv/Scripts/python.exe --no-deps pyarrow==25.0.1
      - run: uv run --no-sync ruff check packages/core scripts tests .github/scripts
        if: runner.os == 'Linux'
      - run: uv run --no-sync ruff format --check packages/core scripts tests .github/scripts
        if: runner.os == 'Linux'
      - run: uv run --no-sync pytest -q
      - run: pnpm install --frozen-lockfile
        if: runner.os == 'Linux' || inputs.windows_browser
      - run: uv run --no-sync python scripts/export_openapi.py
        if: runner.os == 'Linux' || inputs.windows_browser
      - run: pnpm generate:client
        if: runner.os == 'Linux' || inputs.windows_browser
      - run: git diff --exit-code -- packages/core/openapi.json apps/web/src/lib/api.generated.ts
        if: runner.os == 'Linux' || inputs.windows_browser
      - run: pnpm check:web
        if: runner.os == 'Linux' || inputs.windows_browser
      - run: pnpm build:web
        if: runner.os == 'Linux' || inputs.windows_browser
      # All current projects use Chromium headless shell, without a channel.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
        if: runner.os == 'Linux' || inputs.windows_browser
      - run: pnpm test:web
        if: runner.os == 'Linux' || inputs.windows_browser
      - run: pnpm test:diagnostics
        if: runner.os == 'Linux' || inputs.windows_browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  application-verification:
    needs: [scope, application]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify every selected check completed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_GATE'
          import json, os
          results = json.loads(os.environ['CHECK_RESULTS'])
          scope = results['scope']
          required = {'application': 'application'}
          failures = []
          for job, output in required.items():
              result = results[job]['result']
              legitimate_skip = (scope['result'] == 'success'
                                 and scope['outputs'].get(output) == 'false'
                                 and result == 'skipped')
              if result != 'success' and not legitimate_skip:
                  failures.append(job + ': ' + result)
          if scope['result'] != 'success':
              failures.append('scope: ' + scope['result'])
          if failures:
              raise SystemExit('; '.join(failures))
          print('All selected checks passed; unrelated scopes were explicitly skipped.')
          PY_GATE
