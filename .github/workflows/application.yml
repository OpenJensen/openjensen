name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.14.7'
      - run: npm install --global pnpm@12.6.0
      - run: uv sync --frozen
      - name: Install isolated CPU preview reader (POSIX)
        if: runner.os != 'Windows'
        run: |
          uv venv --python 3.14.7 workers/_cpu_readers/.venv
          uv pip install --python workers/_cpu_readers/.venv/bin/python --no-deps pyarrow==25.0.1
      - name: Install isolated CPU preview reader (Windows)
        if: runner.os == 'Windows'
        run: |
          uv venv --python 3.14.7 workers/_cpu_readers/.venv
          uv pip install --python workers/_cpu_readers/.venv/Scripts/python.exe --no-deps pyarrow==25.0.1
      - run: uv run --frozen ruff check packages/core scripts tests
      - run: uv run --frozen ruff format --check packages/core scripts tests
      - run: uv run --frozen pytest -q
      - run: pnpm install --frozen-lockfile
      - run: uv run --frozen python scripts/export_openapi.py
      - run: pnpm generate:client
      - run: git diff --exit-code -- packages/core/openapi.json apps/web/src/lib/api.generated.ts
      - run: pnpm check:web
      - run: pnpm build:web
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
