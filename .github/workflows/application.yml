name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.14.7'
      - run: npm install --global pnpm@12.6.0
      - run: uv sync --frozen
      - run: uv run --frozen ruff check packages/core scripts tests
      - run: uv run --frozen ruff format --check packages/core scripts tests
      - run: uv run --frozen pytest -q
      - run: pnpm install --frozen-lockfile
      - run: uv run --frozen python scripts/export_openapi.py
      - run: pnpm generate:client
      - run: git diff --exit-code -- packages/core/openapi.json apps/web/src/lib/api.generated.ts
      - run: pnpm check:web
      - run: pnpm build:web
