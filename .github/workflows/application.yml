name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    name: Application (${{ matrix.os }})
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.14.7'
      - run: npm install --global pnpm@12.6.0
      - run: uv sync --frozen
      - run: uv run --frozen ruff check packages/core scripts tests
      - run: uv run --frozen ruff format --check packages/core scripts tests
      - run: uv run --frozen pytest -q --junitxml=test-results/application.xml
      - run: pnpm install --frozen-lockfile
      - run: uv run --frozen python scripts/verify_contracts.py
      - run: pnpm check:web
      - run: pnpm build:web
      - name: Preserve application test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-tests-${{ matrix.os }}
          path: test-results/application.xml
          if-no-files-found: warn
