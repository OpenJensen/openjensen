name: Runner routing checks
on:
  pull_request:
    paths:
      - tests/test_ci_scope.py
      - .github/scripts/**
      - .github/workflows/**
      - package.json
      - .node-version
      - .python-version
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","firebird-gcp"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.12.14'
      - name: Application routing tests
        run: |
          uv venv /tmp/runner-tests
          uv pip install --python /tmp/runner-tests/bin/python pytest==9.1.1 PyYAML==6.0.3 ruff==0.16.9
          /tmp/runner-tests/bin/python -m pytest -q tests/test_ci_scope.py
          /tmp/runner-tests/bin/ruff check tests/test_ci_scope.py .github/scripts/ci_scope.py
          /tmp/runner-tests/bin/ruff format --check tests/test_ci_scope.py .github/scripts/ci_scope.py
