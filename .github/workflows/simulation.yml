name: Simulation worker checks
on:
  push:
    paths: ['workers/isaac_sim/**', 'workers/skypilot/**', '.github/workflows/simulation.yml']
  pull_request:
    paths: ['workers/isaac_sim/**', 'workers/skypilot/**', '.github/workflows/simulation.yml']
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg jq
      - run: python -m pip install PyYAML==6.0.3
      - name: Worker and encoding tests
        working-directory: workers/isaac_sim
        env:
          SIM_REQUIRE_VIDEO_TOOLS: '1'
        run: python -m unittest discover -s tests -v
      - name: Launcher tests
        working-directory: workers/skypilot
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: find workers/isaac_sim workers/skypilot -name '*.sh' -exec bash -n {} \;
