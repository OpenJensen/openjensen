name: Simulation worker checks
on:
  workflow_dispatch:
# Do not cancel another workflow, PR or a main-branch verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","firebird-gcp"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            workers/isaac_sim/calibration.requirements.txt
            workers/isaac_sim/calibration-offline.requirements.txt
            workers/skypilot/requirements.txt
            .github/workflows/simulation.yml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg jq
      - run: >-
          python -m pip install
          -r workers/isaac_sim/calibration-offline.requirements.txt
      - name: Worker and encoding tests
        working-directory: workers/isaac_sim
        env:
          SIM_REQUIRE_VIDEO_TOOLS: '1'
        run: python -m unittest discover -s tests -v
      - name: Install pinned SkyPilot SDK for offline launcher compatibility
        run: >-
          python -m pip install -r workers/skypilot/requirements.txt
          -c workers/isaac_sim/calibration.requirements.txt PyYAML==6.0.3 usd-core==26.8
      - name: Check combined simulation dependency compatibility
        run: python -m pip check
      - name: Launcher tests
        working-directory: workers/skypilot
        env:
          SIM_REQUIRE_SKYPILOT: '1'
        run: python -m unittest discover -s tests -v
      - name: Experimental scene checks
        run: python workers/isaac_sim/scenes/so101-pickup/test_experiment.py
      - name: Episode profile checks
        run: python workers/isaac_sim/scenes/so101-pickup/test_episode.py
      - name: Shell syntax
        run: find workers/isaac_sim workers/skypilot -name '*.sh' -exec bash -n {} \;
