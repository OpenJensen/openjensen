name: Prepare patch versions
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: prepare-patch-versions
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Execute only trusted main code. PR files are data read through the Git API.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - run: python .github/scripts/patch_release.py prepare
        env:
          GH_TOKEN: ${{ github.token }}
