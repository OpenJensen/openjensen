name: Publish patch release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
concurrency:
  group: publish-patch-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      # No workflow artifacts or code from the triggering run are executed.
      - run: python .github/scripts/patch_release.py publish
        env:
          GH_TOKEN: ${{ github.token }}
