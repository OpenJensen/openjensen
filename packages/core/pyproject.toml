[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vla-platform"
version = "0.1.1"
description = "OPEN JENSEN self-hosted robotics research workspace"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "sqlalchemy[asyncio]==2.1.1",
  "alembic==1.20.0",
  "typer==0.27.2",
  "aiosqlite>=0.21,<1",
  "filelock>=3.18,<4",
]

[project.optional-dependencies]
tui = ["textual==8.2.8"]

[project.scripts]
jensen = "vla_platform.cli:app"
# Compatibility command for alpha installations.
firebird = "vla_platform.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_platform"]
