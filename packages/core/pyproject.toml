[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vla-platform"
version = "0.1.0"
description = "Local VLA lifecycle application: first foundation and intake slice"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "sqlalchemy[asyncio]==2.1.1",
  "alembic==1.20.0",
  "typer==0.27.2",
  "aiosqlite>=0.21,<1",
  "filelock>=3.18,<4",
  "pyarrow==25.0.1",
]

[project.scripts]
firebird = "vla_platform.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_platform"]
