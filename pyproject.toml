[project]
name = "openjensen-workspace"
version = "0.1.32"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = ["vla-platform"]

[tool.uv.workspace]
members = ["packages/core"]
exclude = ["workers/*"]

[tool.uv.sources]
vla-platform = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "pyyaml==6.0.3",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep temporary folders only for failed tests: a full run otherwise leaves
# hundreds of megabytes behind, three runs deep.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
