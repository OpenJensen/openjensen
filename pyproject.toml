[project]
name = "firebird-workspace"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["vla-platform"]

[tool.uv.workspace]
members = ["packages/core"]

[tool.uv.sources]
vla-platform = { workspace = true }

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

